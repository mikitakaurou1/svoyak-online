  if(f.order.every(i=>i in f.res)){f.order.forEach(i=>{const p=gp(i);p.score+=f.res[i]?(f.bets[i]||1):-(f.bets[i]||1)});f.stage='done'}push()}
};
document.addEventListener('click',e=>{ac();const t=e.target.closest('[data-a]');if(!t)return;const f=ACT[t.dataset.a];if(f)f(t.dataset.v)});
function hostCur(c){let h='';
 if(c.stage==='url')h+=`<input id='u' placeholder='Ссылка SoundCloud или YouTube'><button data-a='seturl'>Запустить трек</button><button class='s' data-a='nourl'>Без трека</button>`;
 else if(c.stage==='assign')S.players.forEach(p=>h+=`<button class='s' data-a='assign' data-v='${p.id}'>Отдать: ${esc(p.name)}</button>`);
 else if(c.stage==='swap'){S.players.filter(p=>p.id!==c.winner).forEach(p=>h+=`<button class='s' data-a='swap' data-v='${p.id}'>Поменяться с: ${esc(p.name)}</button>`);h+=`<button data-a='noswap'>Не меняться</button>`}
 else if(c.reveal)h+=`<p class='mute'>Показываем ответ…</p>`;
 else{if(c.mod==='stake'&&c.buzzer&&!c.stake)h+=`<input id='sk' type='number' inputmode='numeric' placeholder='Ставка игрока'><button data-a='setstake'>Принять ставку</button>`;
  else if(c.buzzer)h+=`<div class='row'><button class='g' data-a='yes'>Верно</button><button class='r' data-a='no'>Неверно</button></div>`;
  h+=`<button class='s' data-a='skip'>Никто не ответил</button>`}
 return h}
function players(){if(!S.players.length)return'';return `<div class='pl'>`+S.players.map(p=>`<div class='p${S.cur&&S.cur.buzzer===p.id?' b':''}${PV&&PV.sc[p.id]!==undefined&&PV.sc[p.id]!==p.score?' pop':''}'><small>${esc(p.name)}${p.id===myId?' (ты)':''}</small><b class='${p.score<0?'neg':''}'>${p.score}</b></div>`).join('')+`</div>`}
function lobby(){return isHost?`<div class='card c'><div class='lab'>код комнаты</div><div class='code'>${code}</div><button class='s' data-a='copy'>Скопировать ссылку для друзей</button></div><div class='card'><div class='lab'>Игроков: ${S.players.length}</div>${S.players.map(p=>`<div class='pn'>${ic('user')} ${esc(p.name)}</div>`).join('')||`<p class='mute'>Пока никого. Кинь друзьям ссылку.</p>`}</div><button data-a='start'>Начать игру</button>`:`<div class='card c'><div class='lab'>ты в комнате</div><div class='code'>${code}</div><p class='mute'>Ждём, пока ведущий начнёт. Игроков: ${S.players.length}</p></div>`}
function boardHtml(){const c=S.cur;let h='';
 if(!c){h+=`<div class='lab'>Раунд ${S.round+1} из 2, потом финал</div><div class='grid'>`+S.cats.map(n=>`<div class='cat'>${esc(n)}</div>`).join('');
  for(let i=0;i<5;i++)S.cats.forEach((n,ci)=>{const u=S.used.includes(S.round+'-'+ci+'-'+i),m=isHost&&S.mods&&S.mods[ci+'-'+i]&&!u;h+=`<div class='cell${u?' u':''}${isHost&&!u?' h':''}' ${isHost&&!u?`data-a='pick' data-v='${ci}-${i}'`:''}>${S.vals[i]}${m?'<i></i>':''}</div>`});
  h+='</div>';
  h+=isHost?`<p class='mute'>Жми на клетку. Оранжевый квадрат: модификатор, его видишь только ты.</p><button class='s' data-a='nxt'>${S.round===0?'К раунду 2':'К финалу'}</button>`:`<p class='mute'>Ведущий выбирает вопрос…</p>`;
  return h}
 h+=`<div class='q'><div class='meta'><span>${esc(c.cat)}</span><span>${c.v}</span></div>`;
 if(c.mod)h+=`<div class='mod'>${ic(MODS[c.mod][0])}<span>${MODS[c.mod][1]}</span></div>`;
 h+=`<h2>${qh(c.q)}</h2>`;
 if(c.url)h+=embed(c.url);
 if(c.a)h+=`<div class='a${c.reveal?'':' priv'}'>${c.reveal?'Ответ':'Ответ (видишь только ты)'}: ${esc(c.a)}</div>`;
 if(c.buzzer)h+=`<p class='who'>отвечает: ${nm(c.buzzer)}${c.stake?' · ставка '+c.stake:''}</p>`;
 h+='</div>';
 if(isHost)h+=`<div class='dock'>${hostCur(c)}</div>`;
 else if(c.tried.includes(myId))h+=`<p class='mute'>Ты уже отвечал на этот вопрос.</p>`;
 else if(!c.stage&&!c.buzzer&&!c.only&&!c.reveal)h+=`<button class='buzz' data-a='buzz'>Я!</button>`;
 return h}
function finalHtml(){const f=S.fin;let h=`<div class='lab'>финал</div>`;
 if(!f.order.length)return h+`<div class='card'>Ни у кого нет баллов для финала.</div>`+(isHost?`<button data-a='again'>Играть заново</button>`:'');
 h+=`<p class='mute'>В финале: ${f.order.map(nm).join(', ')}</p>`;
 if(f.stage==='strike'){h+=`<p>Вычёркивает тему: <b>${nm(f.turn)}</b></p><div class='grid f'>`;
  f.cats.forEach((n,i)=>{const s=f.struck.includes(i);h+=`<div class='cell t${s?' u':''}${isHost&&!s?' h':''}' ${isHost&&!s?`data-a='strike' data-v='${i}'`:''}>${esc(n)}</div>`});h+='</div>';if(isHost)h+=`<p class='mute'>Жми на тему, которую называет игрок.</p>`;return h}
 h+=`<div class='q'><div class='meta'><span>тема финала</span></div><h2>${esc(f.cats[f.rem])}</h2>`;
 if(f.fq)h+=`<div style='font-size:clamp(18px,4.5vw,28px)'>${qh(f.fq)}</div>`;
 if(f.fa)h+=`<p><span class='a'>Ответ: ${esc(f.fa)}</span></p>`;h+='</div>';
 const mine=f.order.includes(myId);
 if(f.stage==='bet'){h+=`<div class='lab'>ставки</div>`;f.order.forEach(id=>h+=`<div class='ans'>${nm(id)}: ${f.bets[id]?(isHost?f.bets[id]:ic('check')+' готово'):'думает…'}</div>`);
  if(mine&&!f.bets[myId])h+=`<input id='bt' type='number' inputmode='numeric' placeholder='Твоя ставка (до всех твоих баллов)'><button data-a='bet'>Поставить</button>`;
  if(isHost)h+=`<button data-a='showq'>Показать вопрос</button>`}
 else if(f.stage==='answer'){h+=`<div class='lab'>пишите ответы</div>`;f.order.forEach(id=>h+=`<div class='ans'>${nm(id)}: ${f.ans[id]?ic('check')+' ответил':'пишет…'}</div>`);
  if(mine&&!f.ans[myId])h+=`<input id='an' placeholder='Твой ответ'><button data-a='sendans'>Отправить</button>`;
  if(isHost)h+=`<button data-a='reveal'>Показать ответы</button>`}
 else{h+=`<div class='lab'>ответы</div>`;f.order.forEach(id=>{const r=f.res[id];h+=`<div class='ans'>${nm(id)}: <b>${esc(f.ans[id]||'—')}</b> (ставка ${f.bets[id]}) ${r===undefined?'':r?`<span class='ok'>верно</span>`:`<span class='no'>неверно</span>`}`;
   if(isHost&&r===undefined)h+=`<div class='row'><button class='g' data-a='mark' data-v='${id}:1'>Верно</button><button class='r' data-a='mark' data-v='${id}:0'>Неверно</button></div>`;h+='</div>'});
  if(f.stage==='done'){const w=[...S.players].sort((a,b)=>b.score-a.score)[0];h+=`<div class='win'>${ic('cup')}<span>${esc(w.name)}: ${w.score}</span></div>`+(isHost?`<button data-a='again'>Играть заново</button>`:'')}}
 return h}
function home(){return `<div class='logo'>СВОЯК<span>//онлайн</span></div><p class='mute'>Своя игра для компании. Ведущий читает вопросы, остальные жмут «Я!».</p><div class='card'><div class='lab'>твоё имя</div><input id='n' maxlength='20' placeholder='Как тебя звать'><button data-a='mk'>Создать комнату: я ведущий</button></div><div class='card'><div class='lab'>код комнаты</div><input id='c' maxlength='8' value='${esc(QR)}' placeholder='ABCD'><button class='s' data-a='jn'>Войти как игрок</button></div><p style='color:var(--bad)'>${esc(err)}</p>`}
function sounds(){const k=S.cur?S.round+'-'+S.cur.c+'-'+S.cur.i:null;
 if(PV){if(k&&k!==PV.k)SND.pick();if(S.cur&&S.cur.buzzer&&S.cur.buzzer!==PV.b)SND.buzz();
  let up=false,dn=false;S.players.forEach(p=>{const o=PV.sc[p.id];if(o!==undefined){if(p.score>o)up=true;if(p.score<o)dn=true}});
  if(up)SND.ok();else if(dn)SND.bad();
  if((S.fin&&S.fin.stage==='done'&&PV.st!=='done')||(S.phase==='final'&&PV.ph!=='final'))SND.final()}
 PV={k,b:S.cur?S.cur.buzzer:null,sc:Object.fromEntries(S.players.map(p=>[p.id,p.score])),st:S.fin?S.fin.stage:null,ph:S.phase}}
function paint(h){if(h===LAST)return;LAST=h;const a=g('app'),keep={};a.querySelectorAll('input').forEach(i=>keep[i.id]=i.value);const fid=document.activeElement&&document.activeElement.id;a.innerHTML=h;a.querySelectorAll('input').forEach(i=>{if(keep[i.id]!==undefined&&keep[i.id]!=='')i.value=keep[i.id]});if(fid&&g(fid))g(fid).focus()}
function render(){
 if(!code){paint(home());return}
 S=isHost?pub(true):V;
 if(!S){paint(`<div class='card c'><div class='lab'>комната</div><div class='code'>${code}</div><p class='mute'>Подключаемся, ждём ведущего…</p></div>`);return}
 let h=`<div class='top'><span>СВОЯК//ОНЛАЙН · <b>${code}</b> · ${ic('mic')} ${esc(S.hostName)}</span><button class='chip' data-a='mute'>${ic(muted?'off':'on')}${muted?'звук выкл':'звук'}</button></div>`+players();
 h+=S.phase==='lobby'?lobby():S.phase==='board'?boardHtml():finalHtml();
 paint(h);sounds()}
render();
</script></body></html>
