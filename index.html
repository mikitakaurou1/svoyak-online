<!doctype html><html lang='ru'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#0e0f0c'><title>Свояк онлайн</title><link href='https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&family=Onest:wght@400;600;800&display=swap' rel='stylesheet'><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><style>:root{--bg:#0e0f0c;--panel:#181a15;--panel2:#20231b;--line:#33372b;--ink:#f1efe6;--mute:#8d9080;--acc:#c8f23a;--hot:#ff6a2b;--bad:#ff5c5c;--ok:#5fe08a;--mono:'JetBrains Mono',monospace}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Onest,system-ui,sans-serif}#bg{position:fixed;inset:0;z-index:0;pointer-events:none}.w{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:12px 12px 130px}.ic{width:1.1em;height:1.1em;vertical-align:-.18em}.top,.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:12px;color:var(--mute);padding:6px 0 10px}.top b{color:var(--acc)}button{font:inherit;cursor:pointer;border:2px solid #000;border-radius:6px;padding:13px 16px;margin:6px 0;width:100%;background:var(--acc);color:#0e0f0c;font-weight:800;box-shadow:3px 3px #000;touch-action:manipulation}button:active{transform:translate(2px,2px);box-shadow:none}button.s{background:var(--panel2);color:var(--ink);border-color:var(--line)}button.g{background:var(--ok)}button.r{background:var(--bad)}button:disabled{opacity:.45;cursor:default}.chip{width:auto;margin:0;padding:6px 10px;box-shadow:none;background:var(--panel);color:var(--ink);border:2px solid var(--line);font-family:var(--mono);font-size:12px}input{background:var(--panel);border:2px solid var(--line);color:var(--ink);border-radius:6px;padding:13px;width:100%;font:inherit;margin:6px 0}input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}.lab{font:11px var(--mono);col
