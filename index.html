function finalHtml(){const f=S.fin;let h='<h2>ФИНАЛ</h2>';
 if(!f.order.length)return h+'<p>Ни у кого нет баллов для финала.</p>';
 h+='<p>В финале: '+f.order.map(nm).join(', ')+'</p>';
 if(f.stage==='strike'){h+='<p>Вычёркивает тему: <b>'+nm(f.turn)+'</b></p><div class="grid">';
  f.cats.forEach((n,i)=>{const s=f.struck.includes(i);h+=`<div class='cell ${s?'u':''}' style='font-size:15px' ${isHost&&!s?`data-a='strike' data-v='${i}'`:''}>${esc(n)}</div>`});h+='</div>';if(isHost)h+='<p>Жми на тему, которую называет игрок.</p>';return h}
 h+='<div class="q"><div>Тема финала</div><h2>'+esc(f.cats[f.rem])+'</h2>';
 if(f.fq)h+='<div style="font-size:22px">'+esc(f.fq)+'</div>';
 if(f.fa)h+='<div class="a">Ответ: '+esc(f.fa)+'</div>';h+='</div>';
 const mine=f.order.includes(myId);
 if(f.stage==='bet'){h+='<h3>Ставки</h3>';f.order.forEach(id=>h+='<div>'+nm(id)+': '+(f.bets[id]?(isHost?f.bets[id]:'готово ✔'):'думает…')+'</div>');
  if(mine&&!f.bets[myId])h+=`<input id='bt' type='number' placeholder='Твоя ставка (до всех твоих баллов)'><button data-a='bet'>Поставить</button>`;
  if(isHost)h+=`<button data-a='showq'>Показать вопрос</button>`}
 else if(f.stage==='answer'){h+='<h3>Пишите ответы</h3>';f.order.forEach(id=>h+='<div>'+nm(id)+': '+(f.ans[id]?'ответил ✔':'пишет…')+'</div>');
  if(mine&&!f.ans[myId])h+=`<input id='an' placeholder='Твой ответ'><button data-a='sendans'>Отправить</button>`;
  if(isHost)h+=`<button data-a='reveal'>Показать ответы</button>`}
 else{h+='<h3>Ответы</h3>';f.order.forEach(id=>{const r=f.res[id];h+='<div style="margin:8px 0">'+nm(id)+': <b>'+esc(f.ans[id]||'—')+'</b> (ставка '+f.bets[id]+') '+(r===undefined?'':r?'<span class="ok">верно</span>':'<span class="no">неверно</span>');
   if(isHost&&r===undefined)h+=`<div class='row'><button class='g' data-a='mark' data-v='${id}:1'>Верно</button><button class='r' data-a='mark' data-v='${id}:0'>Неверно</button></div>`;h+='</div>'});
  if(f.stage==='done'){const w=[...S.players].sort((a,b)=>b.score-a.score)[0];h+='<h2>Победитель: '+esc(w.name)+' 🏆 ('+w.score+')</h2>'}}
 return h}
function render(){const a=g('app');
 if(!code){a.innerHTML=`<h1>Свояк онлайн</h1><input id='n' placeholder='Твоё имя'><button data-a='mk'>Создать комнату (я ведущий)</button><h3>Или войти</h3><input id='c' placeholder='Код комнаты'><button class='s' data-a='jn'>Войти</button><p style='color:#ff8'>${err}</p>`;return}
 S=isHost?pub(true):V;
 if(!S){a.innerHTML='<h2>Комната '+code+'</h2><p>Ждём ведущего…</p>';return}
 let h='<b>Комната: '+code+'</b> · 🎤 '+esc(S.hostName)+'<div class="pl">';
 S.players.forEach(p=>{h+=`<div class='p ${S.cur&&S.cur.buzzer===p.id?'b':''}'>${esc(p.name)}${p.id===myId?' (ты)':''}: <b>${p.score}</b></div>`});h+='</div>';
 if(S.phase==='lobby')h+=isHost?`<p>Зашло игроков: ${S.players.length}. Код: <b>${code}</b></p><button data-a='start'>Начать игру</button>`:'<p>Ждём, пока ведущий начнёт…</p>';
 else if(S.phase==='board')h+=boardHtml();else h+=finalHtml();
 a.innerHTML=h+'<p style="color:#ff8">'+err+'</p>'}
render();
</script></body></html>
