<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Свояк — без ведущего</title><style>body{background:#0e0f0c;color:#c8f23a;font:18px system-ui;padding:24px}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style><p id="status">Загружаем режим без ведущего…</p><script id="extension" type="text/plain">
const POOL=P.filter(t=>t.q.length>=30);
let room=null,net=null,master=false,localView=null,autoCode='',autoError='',lastVersion=-1,voice=false,spoken='',timerLoop=null;
const me=()=>room.players.find(p=>p.id===myId);
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mix(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function snapshot(){const r=room;return{version:r.version,code:r.code,phase:r.phase,players:r.players,index:r.index,deadline:r.deadline,answers:Object.keys(r.answers),bets:Object.keys(r.bets),question:r.current?{text:r.current.q,cat:r.current.cat,value:r.current.value,options:r.current.options}:null,result:r.phase==='result'||r.phase==='done'?r.result:null}}
function broadcast(){room.version++;localView=snapshot();net.send({type:'broadcast',event:'auto-state',payload:localView});autoRender()}
function makeQuestion(final){const available=POOL.flatMap(t=>t.q.map((q,i)=>({...q,cat:t.n,key:t.n+':'+i,level:Math.floor(i/6)}))).filter(q=>!room.used.includes(q.key));const candidates=final?available.filter(q=>q.level>=3):available;const q=mix(candidates)[0];room.used.push(q.key);const wrong=mix([...new Set(POOL.find(t=>t.n===q.cat).q.map(x=>x.a))].filter(a=>a!==q.a)).slice(0,3);return{...q,value:(q.level+1)*100*(room.index>=10?2:1),options:mix([q.a,...wrong])}}
function nextQuestion(){room.current=makeQuestion(false);room.answers={};room.phase='question';room.deadline=Date.now()+18000;broadcast()}
function finishQuestion(final){const q=room.current;const details=room.players.map(p=>{const answer=room.answers[p.id];const ok=Number.isInteger(answer)&&q.options[answer]===q.a;const stake=final?(room.bets[p.id]||0):q.value;const delta=ok?stake:final?-stake:0;p.score+=delta;return{id:p.id,choice:Number.isInteger(answer)?q.options[answer]:null,ok,delta}});room.result={answer:q.a,details,final};room.phase=final?'done':'result';room.deadline=Date.now()+6500;broadcast()}
function handle(msg){if(!master||!room)return;const p=room.players.find(p=>p.id===msg.id);if(msg.t==='hello'){if(!p&&room.phase==='lobby'&&room.players.length<12){room.players.push({id:String(msg.id).slice(0,40),name:String(msg.name||'Игрок').slice(0,20),score:0});broadcast()}else if(p)broadcast();return}if(!p)return;
 if(msg.t==='answer'&&(room.phase==='question'||room.phase==='finalQuestion')&&Date.now()<room.deadline&&msg.id in room.answers===false&&Number.isInteger(msg.option)&&msg.option>=0&&msg.option<4){room.answers[msg.id]=msg.option;broadcast()}
 if(msg.t==='bet'&&room.phase==='bets'&&Date.now()<room.deadline&&!(msg.id in room.bets)){room.bets[msg.id]=Math.max(0,Math.min(Math.max(p.score,0),Math.floor(Number(msg.value))||0));broadcast()}}
function sendAuto(m){const msg={...m,id:myId};if(master)handle(msg);else net.send({type:'broadcast',event:'auto-input',payload:msg})}
function connectAuto(host,code,name){if(net)return;autoCode=code.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);if(!autoCode)return;master=host;const display=String(name||'Игрок').trim().slice(0,20)||'Игрок';
 if(host)room={code:autoCode,version:0,phase:'lobby',players:[{id:myId,name:display,score:0}],index:0,deadline:0,answers:{},bets:{},used:[],current:null,result:null};
 net=sb.channel('svoyak-auto-'+autoCode,{config:{broadcast:{self:false}}});
 net.on('broadcast',{event:'auto-state'},m=>{if(!master){const v=m.payload;if(!v||!Array.isArray(v.players)||v.code!==autoCode)return;localView=v;autoRender()}}).on('broadcast',{event:'auto-input'},m=>handle(m.payload));
 net.subscribe(s=>{if(s==='SUBSCRIBED'){autoError='';if(master)broadcast();else sendAuto({t:'hello',name:display})}else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'||s==='CLOSED'){autoError='Связь прервалась. Не закрывай вкладку; ждём переподключения.';autoRender()}});
 if(!timerLoop)timerLoop=setInterval(()=>{if(master&&room&&room.phase!=='lobby'&&room.phase!=='done'&&Date.now()>=room.deadline){if(room.phase==='question')finishQuestion(false);else if(room.phase==='result'){room.index++;if(room.index>=20){room.phase='bets';room.bets={};room.deadline=Date.now()+30000;broadcast()}else nextQuestion()}else if(room.phase==='bets'){room.current=makeQuestion(true);room.answers={};room.phase='finalQuestion';room.deadline=Date.now()+25000;broadcast()}else if(room.phase==='finalQuestion')finishQuestion(true)}const el=document.getElementById('clock');if(el&&localView)el.textContent=Math.max(0,Math.ceil((localView.deadline-Date.now())/1000))+' с'},200);
 autoRender();setTimeout(()=>{if(!localView){autoError='Комната не найдена или создатель отключился. Проверь код и обнови страницу.';autoRender()}},12000)}
function speakAuto(text){if(!voice||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';u.rate=1;speechSynthesis.speak(u)}
function autoRender(){const app=g('app'),v=localView;let h=`<div class='top'><span>СВОЯК // АВТОВЕДУЩИЙ</span><a style='color:var(--acc)' href='./'>Обычный режим</a></div>`;
 if(!net){const invite=new URLSearchParams(location.search).get('r')||'';h+=`<div class='logo'>ИГРАЮТ<span>//все</span></div><p class='mute'>Без отдельного ведущего. 20 вопросов, 4 варианта, автоматический финал.</p><div class='card'><label for='autoName'>Твоё имя</label><input id='autoName' maxlength='20' placeholder='Как тебя зовут'><button data-auto='create'>Создать комнату</button><label for='autoRoom'>Код комнаты</label><input id='autoRoom' maxlength='8' value='${safe(invite)}' placeholder='Код от друга'><button class='s' data-auto='join'>Присоединиться</button></div><p class='mute'>Правильный ответ: баллы вопроса. Ошибка в раунде: 0. Финал: выигрыш или потеря ставки. Создатель тоже играет, но его вкладка управляет комнатой — не закрывай её.</p>`;app.innerHTML=h;return}
 if(!v){app.innerHTML=h+`<div class='card'>Подключаемся к ${safe(autoCode)}…<p>${safe(autoError)}</p></div>`;return}
 h+=`<div class='top'><b>${safe(v.code)}</b><button class='chip' data-auto='voice'>Озвучка ${voice?'вкл':'выкл'}</button></div><div class='pl'>${v.players.map(p=>`<div class='p'><small>${safe(p.name)}${p.id===myId?' (ты)':''}</small><b>${p.score}</b></div>`).join('')}</div>`;
 if(v.phase==='lobby')h+=`<div class='card c'><div class='lab'>код комнаты</div><div class='code'>${safe(v.code)}</div><button class='s' data-auto='copy'>Скопировать приглашение</button><p>${v.players.length}/12 игроков</p>${master?`<button data-auto='start'>Начать — все играют</button>`:`<p class='mute'>Создатель запускает игру.</p>`}</div><p class='mute'>Темы и вопросы выбирает компьютер. Ответы скрыты до истечения времени. Можно потренироваться одному.</p>`;
 else if(v.phase==='question'||v.phase==='finalQuestion'){const q=v.question,answered=v.answers.includes(myId);h+=`<div class='lab'>${v.phase==='finalQuestion'?'Финал':`Раунд ${v.index<10?1:2} · вопрос ${v.index%10+1}/10`} · <span id='clock'></span></div><div class='q'><div class='meta'><span>${safe(q.cat)}</span><span>${q.value} баллов</span></div><h2>${safe(q.text)}</h2></div><div class='card'>${q.options.map((o,i)=>`<button class='s' data-auto='option' data-option='${i}' ${answered?'disabled':''}>${i+1}. ${safe(o)}</button>`).join('')}<p class='mute'>${answered?'Ответ принят. Ждём окончания таймера.':'Выбери один вариант. Изменить его нельзя.'} Ответили ${v.answers.length}/${v.players.length}</p></div>`}
 else if(v.phase==='bets'){const p=v.players.find(p=>p.id===myId),placed=v.bets.includes(myId);h+=`<div class='q'><div class='meta'>Финал · <span id='clock'></span></div><h2>Скрытая ставка</h2><p>От 0 до ${Math.max(0,p?p.score:0)} баллов. Правильный ответ прибавит ставку, ошибка вычтет. Если не поставить — 0.</p>${placed?`<div class='a'>Ставка принята</div>`:`<input id='autoBet' type='number' inputmode='numeric' min='0' max='${Math.max(0,p?p.score:0)}' value='0'><button data-auto='bet'>Зафиксировать ставку</button>`}<p class='mute'>Готовы ${v.bets.length}/${v.players.length}. На ответ будет 25 секунд.</p></div>`}
 else if(v.phase==='result'||v.phase==='done'){const r=v.result;h+=`<div class='q'><div class='lab'>Правильный ответ</div><h2>${safe(r.answer)}</h2></div>${r.details.map(d=>{const p=v.players.find(p=>p.id===d.id);return `<div class='ans'><b>${safe(p?p.name:'Игрок')}</b>: ${safe(d.choice||'Нет ответа')} <span class='${d.ok?'ok':'no'}'>${d.delta>0?'+':''}${d.delta}</span></div>`}).join('')}`;if(v.phase==='done'){const ranked=[...v.players].sort((a,b)=>b.score-a.score),best=ranked[0].score;h+=`<div class='win'>${ic('cup')} ${ranked.filter(p=>p.score===best).map(p=>safe(p.name)).join(', ')} — ${best}</div>${master?`<button data-auto='again'>Ещё партия</button>`:''}`}else h+=`<p class='mute'>Следующий вопрос через <span id='clock'></span></p>`}
 if(autoError)h+=`<p class='no'>${safe(autoError)}</p>`;
 const bet=g('autoBet')?.value;app.innerHTML=h;if(g('autoBet')&&bet!==undefined)g('autoBet').value=bet;
 if(v.version!==lastVersion){if(v.phase==='question'||v.phase==='finalQuestion'){const key=v.phase+':'+v.index;if(key!==spoken){spoken=key;SND.pick();speakAuto(v.question.text)}}else if(v.phase==='result'||v.phase==='done'){const d=v.result.details.find(x=>x.id===myId);if(d)(d.ok?SND.ok:SND.bad)();if(v.phase==='done')SND.final()}lastVersion=v.version}}
render=autoRender;
document.addEventListener('click',e=>{const b=e.target.closest('[data-auto]');if(!b||b.disabled)return;ac();const a=b.dataset.auto;
 if(a==='create')connectAuto(true,Math.random().toString(36).slice(2,8),g('autoName').value);
 if(a==='join'){const c=g('autoRoom').value.trim();if(c)connectAuto(false,c,g('autoName').value)}
 if(a==='start'&&master&&room.phase==='lobby'&&room.players.length){room.index=0;room.used=[];room.players.forEach(p=>p.score=0);nextQuestion()}
 if(a==='option')sendAuto({t:'answer',option:Number(b.dataset.option)});
 if(a==='bet')sendAuto({t:'bet',value:g('autoBet').value});
 if(a==='voice'){voice=!voice;if(!voice&&'speechSynthesis' in window)speechSynthesis.cancel();autoRender()}
 if(a==='copy'){const link=location.origin+location.pathname+'?r='+autoCode;navigator.clipboard?.writeText(link).then(()=>toast('Приглашение скопировано')).catch(()=>window.prompt('Скопируй ссылку',link))}
 if(a==='again'&&master&&room.phase==='done'){room.phase='lobby';room.current=null;room.result=null;room.index=0;room.answers={};room.bets={};spoken='';broadcast()}});
</script><script>
(async()=>{try{const res=await fetch('./index.html',{cache:'no-store'});if(!res.ok)throw Error('Не удалось загрузить игру');let html=await res.text();const pos=html.lastIndexOf('render();');if(pos<0)throw Error('Несовместимая версия игры');html=html.slice(0,pos)+document.getElementById('extension').textContent+'\nrender();'+html.slice(pos+9);const frame=document.createElement('iframe');frame.title='Свояк — режим без ведущего';frame.srcdoc=html;document.body.appendChild(frame)}catch(e){document.getElementById('status').textContent='Ошибка: '+e.message}})();
</script></html>
