<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e0f0c"><title>Свояк — честный авторежим</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&family=Onest:wght@400;600;800&display=swap" rel="stylesheet"><style>
:root{--bg:#0e0f0c;--ink:#f1efe6;--acc:#c8f23a;--mute:#a0a38e;--line:#33372b;--panel:#181a15;--ok:#5fe08a;--bad:#ff7575}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Onest,system-ui,sans-serif}#app{max-width:920px;margin:auto;padding:18px 14px 80px;position:relative}button,input{font:inherit;border-radius:6px;padding:14px;width:100%;margin:6px 0}button{cursor:pointer;background:var(--acc);color:#10120c;font-weight:800;border:2px solid #000;box-shadow:3px 3px #000;touch-action:manipulation}button:active{transform:translate(1px,1px)}button:disabled{cursor:default;opacity:.6;box-shadow:none}button.s{background:var(--panel);color:var(--ink);border-color:var(--line)}button.selected{border-color:var(--acc);background:#303a16;color:var(--ink)}input{border:2px solid var(--line);background:var(--panel);color:var(--ink)}button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:3px}.top,.meta{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.top{font:12px 'JetBrains Mono',monospace;color:var(--mute);margin-bottom:14px}a{color:var(--acc)}h1{font-size:clamp(38px,9vw,72px);letter-spacing:-.04em;margin:22px 0}h2{font-size:clamp(23px,5vw,37px);line-height:1.25;margin:14px 0}.card{padding:18px;border:1px solid var(--line);background:var(--panel);border-radius:8px;margin:14px 0}.q{padding:clamp(18px,4vw,30px);border:1px solid var(--line);background:var(--panel);border-radius:8px;margin:14px 0}.meta,.lab{font:12px 'JetBrains Mono',monospace;color:var(--mute)}.mute{color:var(--mute);line-height:1.6}.players{display:flex;overflow-x:auto;gap:8px;padding-bottom:8px}.p{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 13px;min-width:100px;flex-shrink:0}.p small{display:block;color:var(--mute)}.p b{font:800 24px 'JetBrains Mono',monospace}.chip{width:auto;padding:8px 10px;font-size:12px;box-shadow:none;margin:0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choices button{text-align:left;min-height:72px;margin:0}.ok{color:var(--ok)}.bad{color:var(--bad)}.code{font:800 clamp(34px,9vw,65px) 'JetBrains Mono',monospace;color:var(--acc);letter-spacing:.08em;overflow-wrap:anywhere}.explain{line-height:1.65}.clock{font:800 22px 'JetBrains Mono',monospace;color:var(--acc)}.banner{color:var(--bad);min-height:20px;font-size:13px}.win{font-size:30px;color:var(--acc);font-weight:800}.ic{width:24px;height:24px;vertical-align:middle}.answer{padding:12px 0;border-bottom:1px solid var(--line)}@media(max-width:560px){.choices{grid-template-columns:1fr}.choices button{min-height:58px}.top{font-size:11px}}@media(prefers-reduced-motion:no-preference){button{transition:background .1s}}
</style></head><body><main id="app">Загружаем подготовленный банк…</main><noscript>Для игры нужен JavaScript.</noscript><script type="module">
import {BANK} from './fair-bank.js?v=1';
import {validate,createRoom,start,input,tick,view,schedule,token} from './fair-engine.js?v=1';
validate(BANK);
const $=id=>document.getElementById(id),id=sessionStorage.getItem('fair-id')||crypto.randomUUID();sessionStorage.setItem('fair-id',id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sb,channel,r=null,v=null,isHost=false,connected=false,code='',name='',offset=0,lastSeen=0,err='',pending=null,lastHTML='',voice=false,lastSpoken='',audio=null,sequence=0;
const seenKey='svoyak-fair-seen-v1',saveKey='svoyak-fair-room-v1';
function stored(key,fallback){try{return JSON.parse(localStorage.getItem(key))||fallback}catch{return fallback}}
function seen(){return stored(seenKey,[])}
function noteSeen(qid){if(!qid)return;try{const a=seen().filter(x=>x!==qid);a.push(qid);localStorage.setItem(seenKey,JSON.stringify(a.slice(-70)))}catch{}}
function persist(){try{sessionStorage.setItem(saveKey,JSON.stringify(r))}catch{}}
function readSaved(){try{const a=JSON.parse(sessionStorage.getItem(saveKey));return a?.host===id?a:null}catch{return null}}
function now(){return Date.now()+offset}
function snapshot(){return view(r,Date.now())}
function publish(changed=true){if(changed){r.rev++;persist()}const s=snapshot();channel.send({type:'broadcast',event:'state',payload:s});accept(s)}
function accept(s){if(!s||s.code!==code||!Array.isArray(s.players))return;if(v&&s.epoch===v.epoch&&s.rev<v.rev)return;lastSeen=Date.now();offset=s.serverNow-Date.now();const changed=!v||s.rev!==v.rev||s.epoch!==v.epoch;v=s;
 if(pending&&(pending.token!==s.token||(pending.t==='answer'?s.answered.includes(id):s.betted.includes(id))))pending=null;
 if(changed){render();if(s.question&&voice&&lastSpoken!==s.token){lastSpoken=s.token;say(s.question.q+'. '+s.question.options.map((a,i)=>(i+1)+'. '+a).join('. '))}}
}
function handle(m){if(!isHost||!m||typeof m!=='object')return;
 if(m.t==='hello'){if(typeof m.id!=='string'||m.id.length>80)return;const p=r.players.find(p=>p.id===m.id);if(!p&&r.phase==='lobby'&&r.players.length<12){r.players.push({id:m.id,name:String(m.name||'Игрок').slice(0,20),score:0});publish()}else publish(false);return}
 if(m.t==='start'&&m.id===r.host){if(start(r,schedule(BANK,seen()),Date.now()))publish();return}
 if(m.t==='again'&&m.id===r.host&&r.phase==='done'){r=createRoom(code,id,name);publish();return}
 if(input(r,m,Date.now()))publish();else publish(false)
}
function send(m){if(!connected){err='Нет соединения. Дождись переподключения.';render();return}const x={...m,id};if(isHost)handle(x);else channel.send({type:'broadcast',event:'input',payload:x})}
async function connect(host,c,n,resume=false){if(channel)return;code=c.trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);if(!code)return;name=n.trim().slice(0,20)||'Игрок';isHost=host;
 if(host)r=resume?readSaved():createRoom(code,id,name);if(host&&!r)return;
 channel=sb.channel('svoyak-curated-v1-'+code,{config:{broadcast:{self:false}}});
 channel.on('broadcast',{event:'state'},({payload})=>{if(!isHost)accept(payload)}).on('broadcast',{event:'input'},({payload})=>handle(payload));
 channel.subscribe(status=>{connected=status==='SUBSCRIBED';if(connected){err='';if(isHost)publish(false);else send({t:'hello',name})}else if(['CLOSED','TIMED_OUT','CHANNEL_ERROR'].includes(status))err='Соединение прервано. Попробуем восстановить.';render()});render();
}
function say(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';u.rate=1.05;speechSynthesis.speak(u)}
function unlock(){try{audio ||= new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{}}
function sound(ok){if(!audio)return;[ok?660:190,ok?880:140].forEach((f,i)=>{const o=audio.createOscillator(),a=audio.createGain(),t=audio.currentTime+i*.1;o.frequency.value=f;o.type='triangle';a.gain.setValueAtTime(.09,t);a.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(a);a.connect(audio.destination);o.start(t);o.stop(t+.23)})}
const cup=`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4h10v6a5 5 0 0 1-10 0V4ZM7 6H3v3a4 4 0 0 0 4 4m10-7h4v3a4 4 0 0 1-4 4m-5 2v5m-4 0h8"/></svg>`;
let resultSound='';
function render(){let h=`<header class="top"><span>СВОЯК // ПОДГОТОВЛЕННЫЙ БАНК</span><a href="./">С ведущим</a></header>`;
 if(!channel){const saved=readSaved(),invite=new URLSearchParams(location.search).get('r')||'';h+=`<h1>Думай. Не угадывай.</h1><p class="mute">${BANK.length} подготовленных вопросов · ${new Set(BANK.map(q=>q.cat)).size} тем · каждый вариант написан для своего вопроса.</p><section class="card"><label for="name">Твоё имя</label><input id="name" maxlength="20" placeholder="Как тебя зовут"><button data-a="create" ${sb?'':'disabled'}>Создать комнату</button><label for="code">Код комнаты</label><input id="code" maxlength="8" value="${esc(invite)}" placeholder="Код от друга"><button data-a="join" class="s" ${sb?'':'disabled'}>Присоединиться</button>${saved?'<button data-a="resume" class="s">Восстановить мою комнату</button>':''}</section><p class="mute">Два раунда по 10 вопросов. Первый: +200 за верный, второй: +400. Ошибка — 0. Все получают одинаковое время и баллы, без бонуса за скорость. Финал: ставка от 0 до всех баллов, +ставка или −ставка. Вопросы не повторяются в партии; история этого браузера снижает повторы между партиями.</p><p class="mute">Дружеская игра, не защищённый турнир: банк и логика доступны в браузере. Вкладка создателя управляет комнатой. Оставь её открытой и активной.</p>`}
 else if(!v)h+=`<section class="card"><div class="code">${esc(code)}</div><p>Подключаемся…</p><p class="mute">Если через 15 секунд комната не появилась, проверь код и наличие создателя онлайн.</p></section>`;
 else{const p=v.players.find(p=>p.id===id);h+=`<div class="top"><b>${esc(code)}</b><button class="s chip" data-a="voice">Озвучка: ${voice?'вкл':'выкл'}</button></div><div class="players">${v.players.map(p=>`<div class="p"><small>${esc(p.name)}${p.id===id?' · ты':''}</small><b>${p.score}</b></div>`).join('')}</div>`;
 if(!p){h+='<section class="card">Вход в эту партию закрыт. Создатель сможет собрать новую после финала.</section>'}
 else if(v.phase==='lobby')h+=`<section class="card"><div class="lab">КОМНАТА</div><div class="code">${esc(code)}</div><p>${v.players.length}/12 игроков</p><button data-a="copy" class="s">Пригласить друзей</button>${isHost?`<button data-a="start" ${connected?'':'disabled'}>Начать — все играют</button>`:'<p class="mute">Создатель запускает игру.</p>'}</section><p class="mute">После вопроса — объяснение и результаты. Следующий вопрос через 14 секунд или когда все нажмут «Дальше». На обычный вопрос 28 секунд; на финальный 35. Ответ фиксируется один раз. Во время приёма ответов верный вариант не показывается.</p>`;
 else if(['question','final'].includes(v.phase)){const q=v.question,done=v.answered.includes(id),waiting=pending?.t==='answer';h+=`<section class="q"><div class="meta"><span>${v.phase==='final'?'ФИНАЛ':`РАУНД ${v.index<10?1:2} · ${v.index%10+1}/10`} · ${esc(v.cat)}</span><span class="clock" id="clock"></span></div><h2>${esc(q.q)}</h2><div class="lab">${q.value===null?'ИГРАЕМ НА ВАШУ СТАВКУ':`ЗА ВЕРНЫЙ ОТВЕТ +${q.value}`}</div></section><div class="choices">${q.options.map((s,i)=>`<button class="s ${waiting&&pending.option===i?'selected':''}" data-a="answer" data-i="${i}" ${done||waiting||!connected?'disabled':''}>${i+1}. ${esc(s)}</button>`).join('')}</div><p class="mute">${done?'Ответ принят. Изменить нельзя.':waiting?'Отправляем ответ, ждём подтверждения…':'Выбери один вариант. У всех одинаковые условия.'} Ответили ${v.answered.length}/${v.players.length}.</p>`}
 else if(v.phase==='bets'){const done=v.betted.includes(id);h+=`<section class="q"><div class="meta"><span>ФИНАЛ · ${esc(v.cat)}</span><span class="clock" id="clock"></span></div><h2>Сначала ставка. Потом вопрос.</h2><p class="mute">От 0 до ${p.score}. Ошибка или отсутствие ответа отнимают ставку. Не поставил — ставка 0. Выбор ставки необратим.</p>${done?'<p class="ok">Ставка принята.</p>':`<input id="bet" type="number" min="0" max="${p.score}" inputmode="numeric" value="0"><button data-a="bet" ${pending||!connected?'disabled':''}>Зафиксировать ставку</button>`}<p class="mute">Готовы ${v.betted.length}/${v.players.length}.</p></section>`}
 else if(['result','done'].includes(v.phase)){const a=v.result;h+=`<section class="q"><div class="lab">ВЕРНЫЙ ОТВЕТ</div><h2>${esc(a.options[a.correct])}</h2><p class="explain">${esc(a.why)}</p></section><section class="card">${a.details.map(d=>{const p=v.players.find(p=>p.id===d.id);return `<div class="answer"><b>${esc(p?.name)}</b>: ${d.selected===null?'Нет ответа':esc(a.options[d.selected])}<br><span class="${d.ok?'ok':'bad'}">${d.delta>0?'+':''}${d.delta}${v.phase==='done'?` · ставка ${d.stake}`:''}</span></div>`}).join('')}</section>`;
 if(v.phase==='done'){const best=Math.max(...v.players.map(p=>p.score));h+=`<div class="win">${cup} ${v.players.filter(p=>p.score===best).map(p=>esc(p.name)).join(', ')} · ${best}</div>${isHost?'<button data-a="again">Новая партия</button>':''}`}
 else h+=`<button data-a="ready" ${v.ready.includes(id)?'disabled':''}>${v.ready.includes(id)?'Ждём остальных…':'Дальше'}</button><p class="mute">Или автоматически через <span id="clock"></span>. Готовы ${v.ready.length}/${v.players.length}.</p>`;
 if(resultSound!==v.token){resultSound=v.token;const mine=a.details.find(d=>d.id===id);if(mine)sound(mine.ok)}
 }
 }
 h+=`<p class="banner" role="status" id="status">${esc(err)}</p>`;
 if(h===lastHTML)return;lastHTML=h;const values={};document.querySelectorAll('input').forEach(el=>values[el.id]=el.value);const focus=document.activeElement?.id;const sel=document.activeElement?.selectionStart;$('app').innerHTML=h;for(const[k,val]of Object.entries(values)){if($(k))$(k).value=val}if(focus&&$(focus)){$(focus).focus();try{$(focus).setSelectionRange(sel,sel)}catch{}}
}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;unlock();const a=b.dataset.a;
 if(a==='create')connect(true,crypto.randomUUID().replaceAll('-','').slice(0,6),$('name').value);
 if(a==='join'){if(!$('code').value.trim()){err='Введи код комнаты.';render()}else connect(false,$('code').value,$('name').value)}
 if(a==='resume'){const s=readSaved();if(s)connect(true,s.code,s.players.find(p=>p.id===id)?.name||'Игрок',true)}
 if(a==='start')send({t:'start'});if(a==='again')send({t:'again'});
 if(a==='answer'&&!pending){pending={t:'answer',token:v.token,option:Number(b.dataset.i)};send(pending);render()}
 if(a==='bet'&&!pending){const value=Number($('bet').value),p=v.players.find(p=>p.id===id);if(!Number.isInteger(value)||value<0||value>p.score){err='Введи целую ставку в допустимом диапазоне.';render();return}pending={t:'bet',token:v.token,value};send(pending);render()}
 if(a==='ready')send({t:'ready',token:v.token});
 if(a==='copy'){const url=new URL(location.href);url.search='';url.searchParams.set('r',code);try{await navigator.clipboard.writeText(url.href);err='Приглашение скопировано.'}catch{window.prompt('Скопируй приглашение',url.href)}render()}
 if(a==='voice'){voice=!voice;if(!voice&&'speechSynthesis'in window)speechSynthesis.cancel();render()}
});
setInterval(()=>{if(isHost&&r&&connected){const oldPhase=r.phase;if(tick(r,Date.now())){if(oldPhase==='question'||oldPhase==='final')noteSeen(r.deck[r.index]?.id);publish()}}const el=$('clock');if(el&&v)el.textContent=Math.max(0,Math.ceil((v.deadline-now())/1000))+' с';if(channel&&!isHost&&lastSeen&&Date.now()-lastSeen>12000){$('status').textContent='Нет данных от создателя. Таймер может ждать его возвращения.'}},200);
setInterval(()=>{if(!channel||!connected)return;if(isHost)publish(false);else{if(pending)send(pending);if(!v)send({t:'hello',name})}},1500);
render();
try{const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');sb=createClient('https://oqvebfgpvqgfbmygmowj.supabase.co','sb_publishable_JNu0J0xODiiA_7Z879WbtQ_wQGRo8VQ');render()}catch{err='Не удалось загрузить сетевой модуль. Обнови страницу.';render()}
</script></body></html>
