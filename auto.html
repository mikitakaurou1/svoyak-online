<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Свояк — автоматический ведущий</title><style>
:root{--bg:#0e0f0c;--panel:#191c15;--line:#373e2b;--ink:#f1efe6;--lime:#c8f23a;--muted:#a2a58f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}main{max-width:980px;margin:auto;padding:16px 12px 80px}header,.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}header{font:12px monospace;color:var(--muted);margin-bottom:20px}a{color:var(--lime)}h1{font-size:clamp(34px,8vw,65px);letter-spacing:-.04em}h2{font-size:clamp(23px,4.8vw,36px);line-height:1.25}button,input{font:inherit;width:100%;border-radius:6px;padding:13px;margin:5px 0}button{cursor:pointer;background:var(--lime);color:#10130a;font-weight:750;border:2px solid #000;box-shadow:3px 3px #000;touch-action:manipulation}button.s{background:var(--panel);border-color:var(--line);color:var(--ink)}button:disabled{opacity:.4;cursor:default;box-shadow:none}button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:2px}input{background:var(--panel);border:2px solid var(--line);color:var(--ink)}.card{padding:20px;margin:14px 0;background:var(--panel);border:1px solid var(--line);border-radius:8px}.muted{color:var(--muted);line-height:1.6}.meta,.clock{font-family:monospace}.clock,.good{color:var(--lime)}.bad{color:#ff8585}.players{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}.p{min-width:105px;flex-shrink:0;background:var(--panel);border:1px solid var(--line);padding:9px 12px;border-radius:6px}.p.active{border-color:var(--lime)}.p small{display:block;color:var(--muted)}.p b{font:700 24px monospace}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.cat{display:flex;align-items:center;justify-content:center;min-height:56px;text-align:center;font-size:clamp(10px,2.5vw,15px);font-weight:750;overflow-wrap:anywhere;background:var(--panel);border:1px solid var(--line);padding:6px}.cell{margin:0;padding:20px 0;font:700 clamp(16px,4.4vw,28px) monospace}.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.options button{margin:0;text-align:left;min-height:65px}.code{font:700 clamp(32px,9vw,60px) monospace;letter-spacing:.1em;color:var(--lime)}.chip{width:auto;padding:7px 10px;font-size:12px}.notice{border-left:4px solid #ff8585;padding:10px 14px;background:#291b17;margin:12px 0}.buzz{font-size:28px;padding:20px}.win{font-size:30px;color:var(--lime)}#error{color:#ffb77d;line-height:1.5}@media(max-width:560px){.options{grid-template-columns:1fr}.cell{padding:17px 0}}
</style></head><body><main><div id="app">Загружаем игру…</div><p id="error" role="status"></p></main><script type="module">
import {BANK} from './fair-bank.js?v=1';
import {validate,createRoom,setup,start,input,tick,view} from './fair-engine.js?v=2';
validate(BANK);
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=sessionStorage.getItem('classic-auto-id')||crypto.randomUUID();sessionStorage.setItem('classic-auto-id',id);
let sb,ch,r=null,v=null,host=false,online=false,code='',name='',pending=null,last='',offset=0,seenAt=0,voice=false,spoken='',error='';
const saveKey='classic-auto-room-v2',historyKey='classic-auto-seen-v2';
function saved(){try{const s=JSON.parse(sessionStorage.getItem(saveKey));return s?.host===id?s:null}catch{return null}}
function history(){try{return JSON.parse(localStorage.getItem(historyKey))||[]}catch{return []}}
function remember(qid){if(!qid)return;try{localStorage.setItem(historyKey,JSON.stringify([...history().filter(x=>x!==qid),qid].slice(-70)))}catch{}}
function publish(change=true){if(change){r.rev++;try{sessionStorage.setItem(saveKey,JSON.stringify(r))}catch{}}const s=view(r,Date.now());ch.send({type:'broadcast',event:'state',payload:s});accept(s)}
function accept(s){if(!s||s.code!==code||!Array.isArray(s.players))return;if(v&&v.epoch===s.epoch&&s.rev<v.rev)return;seenAt=Date.now();offset=s.serverNow-Date.now();const changed=!v||v.epoch!==s.epoch||v.rev!==s.rev;v=s;if(pending&&pending.token!==s.token)pending=null;
 if(pending&&pending.t==='bet'&&s.f?.betted.includes(id))pending=null;if(pending&&pending.t==='finalAnswer'&&s.f?.answered.includes(id))pending=null;
 if(changed){render();const q=s.question?.q||s.f?.question?.q;if(voice&&q&&spoken!==q){spoken=q;say(q)}}}
function handle(m){if(!host||!r||!m||typeof m!=='object')return;
 if(m.t==='hello'){if(typeof m.id!=='string'||m.id.length>80)return;const p=r.players.find(p=>p.id===m.id);if(!p&&r.phase==='lobby'&&r.players.length<12){r.players.push({id:m.id,name:String(m.name||'Игрок').slice(0,20),score:0});publish()}else publish(false);return}
 if(m.t==='start'&&m.id===r.host){if(start(r,setup(BANK,history()),Date.now()))publish();return}
 if(m.t==='again'&&m.id===r.host&&r.phase==='done'){const players=r.players.map(p=>({...p,score:0}));r=createRoom(code,id,name);r.players=players;publish();return}
 const before=r.phase;if(input(r,m,Date.now())){if((r.phase==='result'||r.phase==='done')&&before!==r.phase)remember(r.result?.id);publish()}else publish(false)
}
function send(m){if(!online){error='Нет соединения. Дождись переподключения.';render();return}const msg={...m,id};if(host)handle(msg);else ch.send({type:'broadcast',event:'input',payload:msg})}
function connect(isHost,c,n,resume=false){if(ch)return;code=c.trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);if(!code)return;host=isHost;name=n.trim().slice(0,20)||'Игрок';if(host)r=resume?saved():createRoom(code,id,name);if(host&&!r)return;
 ch=sb.channel('classic-auto-v2-'+code,{config:{broadcast:{self:false}}});ch.on('broadcast',{event:'state'},({payload})=>{if(!host)accept(payload)}).on('broadcast',{event:'input'},({payload})=>handle(payload));
 ch.subscribe(s=>{online=s==='SUBSCRIBED';if(online){error='';if(host)publish(false);else send({t:'hello',name})}else if(['CHANNEL_ERROR','CLOSED','TIMED_OUT'].includes(s))error='Связь прервалась, ждём переподключения.';render()});render()}
function say(q){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const a=new SpeechSynthesisUtterance(q);a.lang='ru-RU';speechSynthesis.speak(a)}
function nm(pid){return esc(v.players.find(p=>p.id===pid)?.name||'Игрок')}
function choices(q,type,allowed,wrong=[]){return `<div class="options">${q.options.map((s,i)=>`<button class="s" data-a="${type}" data-i="${i}" ${!allowed||pending||wrong.includes(i)||!online?'disabled':''}>${i+1}. ${esc(s)}${wrong.includes(i)?' — неверно':''}</button>`).join('')}</div>`}
function render(){let h='<header><span>СВОЯК // АВТОВЕДУЩИЙ · ТАБЛО</span><a href="./">С ведущим</a></header>';
 if(!ch){const invite=new URLSearchParams(location.search).get('r')||'';h+=`<h1>Та же игра.<br>Без ведущего.</h1><section class="card"><label for="name">Твоё имя</label><input id="name" maxlength="20" placeholder="Имя"><button data-a="create" ${sb?'':'disabled'}>Создать комнату</button><label for="code">Код комнаты</label><input id="code" value="${esc(invite)}" maxlength="8" placeholder="Код от друга"><button class="s" data-a="join" ${sb?'':'disabled'}>Войти</button>${saved()?'<button class="s" data-a="resume">Восстановить мою комнату</button>':''}</section><p class="muted">Выбирай тему и стоимость. На свой вопрос отвечаешь первым. Ошибка — минус стоимость и право перехвата остальным. Верно — плюс стоимость и следующий выбор твой. Повторно отвечать на один вопрос нельзя.</p>`}
 else if(!v)h+=`<section class="card"><div class="code">${esc(code)}</div><p>Ждём комнату… Проверь код, если подключение затянулось.</p></section>`;
 else{const player=v.players.find(p=>p.id===id);h+=`<div class="meta"><b>${esc(code)}</b><button class="s chip" data-a="voice">Озвучка ${voice?'вкл':'выкл'}</button></div><div class="players">${v.players.map(p=>`<div class="p ${(v.question?.active||v.chooser)===p.id?'active':''}"><small>${esc(p.name)}${p.id===id?' · ты':''}</small><b>${p.score}</b></div>`).join('')}</div>`;
 if(!player)h+='<section class="card">Новые игроки могут войти только в лобби.</section>';
 else if(v.phase==='lobby')h+=`<section class="card"><div class="code">${esc(code)}</div><p>${v.players.length}/12 игроков</p><button class="s" data-a="copy">Пригласить друзей</button>${host?`<button data-a="start" ${online?'':'disabled'}>Начать игру</button>`:'<p>Создатель запускает партию.</p>'}</section><p class="muted">2 раунда, по 5 тем и 5 стоимостей. Первый: 100–500, второй: 200–1000. После ошибки остальные нажимают «Я!», первый получает попытку. На ответ 20 секунд, затем ошибка и минус. На перехват 15 секунд — это максимум, ответ можно дать сразу. Финал: вычёркивание тем, ставки, проверка компьютером.</p><p class="muted">Создатель тоже играет. Его вкладка управляет комнатой: оставляй её активной. Это дружеская клиентская игра, не защищённый турнир. Авторежим использует отдельный банк из ${BANK.length} вопросов.</p>`;
 else if(v.phase==='board'){const allowed=v.chooser===id;h+=`<section class="card"><div class="meta"><span>Раунд ${v.round+1} · выбирает ${nm(v.chooser)}</span><span id="clock" class="clock"></span></div><p class="muted">${allowed?'Выбери тему и стоимость. Ты отвечаешь первым.':'Ждём выбора. Через 30 секунд без выбора очередь перейдёт дальше.'}</p></section><div class="board">${v.board.map(c=>`<div class="cat">${esc(c.cat)}</div>`).join('')}`;for(let i=0;i<5;i++)v.board.forEach((c,ci)=>{const cell=c.cells[i];h+=`<button class="cell ${cell.used?'s':''}" data-a="pick" data-c="${ci}" data-i="${i}" ${cell.used||!allowed||pending||!online?'disabled':''}>${cell.used?'—':cell.value}</button>`});h+='</div>'}
 else if(['answer','buzz'].includes(v.phase)){const q=v.question,active=q.active===id,eligible=!q.tried.includes(id);if(v.notice)h+=`<div class="notice">${nm(v.notice.id)}: ${esc(v.notice.text)} · ${v.notice.delta}</div>`;h+=`<section class="card"><div class="meta"><span>${esc(q.cat)} · ${q.value}</span><span id="clock" class="clock"></span></div><h2>${esc(q.q)}</h2><p class="muted">${v.phase==='answer'?`Отвечает ${nm(q.active)}${active?' — выбери вариант.':''}`:'Вопрос открыт для перехвата. Кто первым нажмёт «Я!», тот отвечает.'}</p></section>${choices(q,'answer',active&&v.phase==='answer',q.wrong)}`;
 if(v.phase==='buzz'&&eligible)h+=`<button class="buzz" data-a="buzz" ${pending||!online?'disabled':''}>Я!</button><button class="s" data-a="pass" ${pending?'disabled':''}>Пас — без штрафа</button>`;else if(!eligible)h+='<p class="muted">Ты уже использовал попытку или отказался от этого вопроса.</p>';if(pending)h+='<p class="muted">Ждём подтверждения действия…</p>'}
 else if(v.phase==='result'){if(v.notice&&!v.result.winner)h+=`<div class="notice">${nm(v.notice.id)}: ${esc(v.notice.text)} · ${v.notice.delta}</div>`;h+=`<section class="card"><div class="meta"><span>${v.result.winner?`${nm(v.result.winner)} · верно · +${v.result.value}`:'Никто не ответил'}</span><span id="clock" class="clock"></span></div><h2>${esc(v.result.answer)}</h2><p class="muted">${esc(v.result.why)}</p>${v.chooser===id?'<button data-a="next">Вернуться к табло</button>':''}<p class="muted">Следующий выбор: ${nm(v.chooser)}. Табло откроется автоматически через несколько секунд.</p></section>`}
 else if(v.phase==='strike'){h+=`<section class="card"><div class="meta"><span>Финал · вычёркивает ${nm(v.f.turn)}</span><span id="clock" class="clock"></span></div><h2>Оставьте одну тему</h2>${v.f.cats.map((cat,i)=>`<button class="s" data-a="strike" data-i="${i}" ${v.f.struck.includes(i)||v.f.turn!==id||pending?'disabled':''}>${esc(cat)}${v.f.struck.includes(i)?' — вычеркнута':''}</button>`).join('')}</section>`}
 else if(v.phase==='bets'){const inFinal=v.f.order.includes(id),done=v.f.betted.includes(id);h+=`<section class="card"><div class="meta"><span>Финал · ${esc(v.f.cat)}</span><span id="clock" class="clock"></span></div><h2>Скрытая ставка</h2><p class="muted">От 0 до ${Math.max(0,player.score)}. Верно: +ставка. Неверно или нет ответа: −ставка. Без ставки: 0.</p>${inFinal&&!done?`<input id="bet" type="number" min="0" max="${player.score}" value="0" inputmode="numeric"><button data-a="bet" ${pending?'disabled':''}>Зафиксировать</button>`:`<p>${inFinal?'Ставка принята.':'В финал проходят игроки с положительным счётом.'}</p>`}<p>Готовы ${v.f.betted.length}/${v.f.order.length}</p></section>`}
 else if(v.phase==='final'){const allowed=v.f.order.includes(id)&&!v.f.answered.includes(id);h+=`<section class="card"><div class="meta"><span>Финал · ${esc(v.f.cat)}</span><span id="clock" class="clock"></span></div><h2>${esc(v.f.question.q)}</h2></section>${choices(v.f.question,'finalAnswer',allowed)}<p class="muted">Ответили ${v.f.answered.length}/${v.f.order.length}. ${allowed?'Один ответ, изменить нельзя.':'Ответ принят либо ты наблюдаешь.'}</p>`}
 else if(v.phase==='done'){const best=Math.max(...v.players.map(p=>p.score));h+=`<section class="card"><h2 class="win">${v.players.filter(p=>p.score===best).map(p=>esc(p.name)).join(', ')} · ${best}</h2>${v.result?`<h2>${esc(v.result.answer)}</h2><p class="muted">${esc(v.result.why)}</p>`:'<p>Ни у кого не осталось положительных баллов для финала.</p>'}${(v.f?.details||[]).map(d=>`<p>${nm(d.id)}: ${esc(d.selected||'Нет ответа')} · ставка ${d.stake} · ${d.delta>0?'+':''}${d.delta}</p>`).join('')}${host?'<button data-a="again">Новая партия с теми же игроками</button>':''}</section>`}
 }
 $('error').textContent=error;if(h===last)return;last=h;const values={};document.querySelectorAll('input').forEach(el=>values[el.id]=el.value);const focus=document.activeElement?.id;$('app').innerHTML=h;for(const[k,val]of Object.entries(values))if($(k))$(k).value=val;if(focus&&$(focus))$(focus).focus();
}
function action(m){if(pending||!v)return;pending={...m,token:v.token};send(pending);render()}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;
 if(a==='create')connect(true,crypto.randomUUID().replaceAll('-','').slice(0,6),$('name').value);
 else if(a==='join'){if(!$('code').value.trim()){error='Введи код.';render()}else connect(false,$('code').value,$('name').value)}
 else if(a==='resume'){const s=saved();if(s)connect(true,s.code,s.players.find(p=>p.id===id)?.name||'Игрок',true)}
 else if(a==='start'||a==='again')send({t:a});
 else if(a==='pick')action({t:a,c:Number(b.dataset.c),i:Number(b.dataset.i)});
 else if(a==='answer'||a==='finalAnswer')action({t:a,option:Number(b.dataset.i)});
 else if(a==='strike')action({t:a,i:Number(b.dataset.i)});
 else if(['buzz','pass','next'].includes(a)){if(a==='pass'){send({t:a,token:v.token})}else action({t:a})}
 else if(a==='bet'){const value=Number($('bet').value),p=v.players.find(p=>p.id===id);if(!Number.isInteger(value)||value<0||value>p.score){error='Ставка должна быть целым числом в допустимом диапазоне.';render()}else action({t:a,value})}
 else if(a==='voice'){voice=!voice;if(!voice&&'speechSynthesis'in window)speechSynthesis.cancel();render()}
 else if(a==='copy'){const u=new URL(location.href);u.search='';u.searchParams.set('r',code);try{await navigator.clipboard.writeText(u.href);error='Приглашение скопировано.'}catch{window.prompt('Скопируй приглашение',u.href)}render()}
});
setInterval(()=>{if(host&&r&&online){const phase=r.phase;if(tick(r,Date.now())){if(r.phase==='result'||r.phase==='done')remember(r.result?.id);publish()}}const clock=$('clock');if(clock&&v)clock.textContent=Math.max(0,Math.ceil((v.deadline-Date.now()-offset)/1000))+' с';if(ch&&!host&&seenAt&&Date.now()-seenAt>12000)$('error').textContent='Создатель не отвечает. Не закрывай вкладку; ждём восстановления.'},150);
setInterval(()=>{if(!ch||!online)return;if(host)publish(false);else{if(pending)send(pending);if(!v)send({t:'hello',name})}},1000);
render();try{const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');sb=createClient('https://oqvebfgpvqgfbmygmowj.supabase.co','sb_publishable_JNu0J0xODiiA_7Z879WbtQ_wQGRo8VQ');render()}catch{error='Не удалось загрузить сетевой модуль. Обнови страницу.';render()}
</script></body></html>
